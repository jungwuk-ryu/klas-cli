name: klas_cli
description: Agent-first Dart CLI for KLAS built on top of klasflow.
version: 1.1.0
repository: https://github.com/jungwuk-ryu/klas-cli
issue_tracker: https://github.com/jungwuk-ryu/klas-cli/issues
documentation: https://github.com/jungwuk-ryu/klas-cli#readme

environment:
  sdk: ^3.11.1

executables:
  klas: klas

dependencies:
  args: ^2.7.0
  cryptography: ^2.7.0
  http: ^1.5.0
  html: ^0.15.6
  klasflow: ^1.3.0

# Pin the verified SDK until its hosted 1.3.0 release is available.
dependency_overrides:
  klasflow:
    git:
      url: https://github.com/jungwuk-ryu/klas-flow.git
      ref: 7b1dadf4e0b9bdf75ccf3badaa52bf31a883ef22

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
